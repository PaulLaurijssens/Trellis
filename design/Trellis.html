document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rgba(130,160,200,0.15);color:rgba(160,180,210,0.5);\">1<\u002Fspan>\n<span style=\"width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;border:1px solid rgba(130,160,200,0.15);color:rgba(160,180,210,0.5);\">2<\u002Fspan>\n<span style=\"width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;border:1px solid rgba(84,169,255,0.5);background:rgba(84,169,255,0.15);color:#BFDCFF;\">3<\u002Fspan>\n<span style=\"width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;border:1px solid rgba(130,160,200,0.15);color:rgba(160,180,210,0.5);\">4<\u002Fspan>\n<span style=\"width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;border:1px solid rgba(130,160,200,0.15);color:rgba(160,180,210,0.5);\">5<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin:14px 24px 0;background:rgba(255,255,255,0.025);border:1px solid rgba(130,160,200,0.1);border-radius:10px;padding:13px 15px;\">\n<div style=\"font-size:10px;letter-spacing:1.4px;color:rgba(150,168,195,0.5);margin-bottom:7px;\">WHERE WE LEFT OFF<\u002Fdiv>\n<div style=\"font-size:12.5px;line-height:1.5;color:#A9B8CC;\">We compared softmax attention’s O(n²) cost with kernel feature maps, and got as far as reordering the computation. The associativity step still felt shaky.<\u002Fdiv>\n<div style=\"margin-top:10px;display:flex;flex-direction:column;gap:5px;\">\n<div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n<span style=\"font-size:9px;color:rgba(160,180,210,0.45);\">▾<\u002Fspan><span style=\"font-size:11.5px;color:#5FCE9E;\">Covered ✓<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(180,200,220,0.7);border:1px solid rgba(95,206,158,0.25);border-radius:10px;padding:2px 8px;\">attention scaling<span style=\"color:rgba(160,180,210,0.4);\">×<\u002Fspan><\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(180,200,220,0.7);border:1px solid rgba(95,206,158,0.25);border-radius:10px;padding:2px 8px;\">kernel trick<span style=\"color:rgba(160,180,210,0.4);\">×<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"font-size:9px;color:rgba(160,180,210,0.45);\">▸<\u002Fspan><span style=\"font-size:11.5px;color:rgba(160,180,210,0.7);\">Struggling with<\u002Fspan><span style=\"font-size:10.5px;color:rgba(150,168,195,0.4);\">1<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"font-size:9px;color:rgba(160,180,210,0.45);\">▸<\u002Fspan><span style=\"font-size:11.5px;color:rgba(160,180,210,0.7);\">Misconceptions<\u002Fspan><span style=\"font-size:10.5px;color:rgba(150,168,195,0.4);\">1<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin:14px 24px 0;\">\n<div style=\"font-size:10px;letter-spacing:1.4px;color:rgba(150,168,195,0.5);margin-bottom:10px;\">IN YOUR TREE<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;\">\n<div style=\"display:flex;align-items:center;gap:8px;\">\n<span style=\"font-size:11.5px;padding:4px 11px;border-radius:12px;border:1px solid #54A9FF;background:rgba(84,169,255,0.12);color:#BFDCFF;box-shadow:0 0 10px rgba(84,169,255,0.2);\">linearized attention<\u002Fspan>\n<span style=\"font-size:10px;color:rgba(150,168,195,0.45);\">you are here<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-left:12px;border-left:1px solid rgba(130,160,200,0.2);padding-left:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;\">\n<span style=\"font-size:10px;color:rgba(150,168,195,0.45);margin-right:2px;\">builds on<\u002Fspan>\n<span style=\"font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid rgba(95,206,158,0.5);color:#9FE0C4;\">softmax attention ✓<\u002Fspan>\n<span style=\"font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid rgba(84,169,255,0.5);color:#9CC8FF;\">kernel methods<\u002Fspan>\n<span style=\"font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid rgba(95,206,158,0.5);color:#9FE0C4;\">matrix associativity ✓<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-left:12px;border-left:1px dashed rgba(130,160,200,0.2);padding-left:14px;display:flex;align-items:center;gap:7px;\">\n<span style=\"font-size:10px;color:rgba(150,168,195,0.45);margin-right:2px;\">related<\u002Fspan>\n<span style=\"font-size:11px;padding:3px 10px;border-radius:12px;border:1px dashed rgba(91,102,115,0.8);color:rgba(160,180,210,0.6);\">flash attention<\u002Fspan>\n<span style=\"font-size:11px;padding:3px 10px;border-radius:12px;border:1px dashed rgba(91,102,115,0.8);color:rgba(160,180,210,0.6);\">state space models<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:32px 24px 16px;margin-top:26px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,black 44px);mask-image:linear-gradient(to bottom,transparent 0,black 44px);\">\n<div style=\"max-width:84%;align-self:flex-start;border-left:2px solid #E5A64A;background:rgba(229,166,74,0.05);border-radius:0 10px 10px 0;padding:10px 14px;font-family:'Newsreader',serif;font-size:14.5px;line-height:1.55;color:#D7DFEA;\">Last time you saw why softmax attention costs O(n²): every query is compared against every key. Linearized attention starts from a question — what if we swap the softmax for a feature map φ, so the computation can be reordered?<\u002Fdiv>\n<div style=\"max-width:76%;align-self:flex-end;background:rgba(84,169,255,0.1);border:1px solid rgba(84,169,255,0.18);border-radius:10px;padding:9px 13px;font-size:13.5px;line-height:1.5;color:#CFE2F8;\">So instead of scoring every pair, you compute one summary and reuse it for every query?<\u002Fdiv>\n<div style=\"max-width:84%;align-self:flex-start;border-left:2px solid #E5A64A;background:rgba(229,166,74,0.05);border-radius:0 10px 10px 0;padding:10px 14px;font-family:'Newsreader',serif;font-size:14.5px;line-height:1.55;color:#D7DFEA;\">Exactly — and that reuse is just matrix associativity. Group the product right-to-left and you build a single running state from the keys and values:\n<pre style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.6;background:rgba(0,0,0,0.4);border:1px solid rgba(130,160,200,0.12);border-radius:6px;padding:10px 12px;color:#9CC8FF;margin:9px 0 2px;overflow:hidden;\"># softmax attention — O(n²)\nout = softmax(Q @ K.T) @ V\n\n# linearized attention — O(n)\nstate = phi(K).T @ V    # d×d, built once\nout   = phi(Q) @ state<\u002Fpre><\u002Fdiv>\n<div style=\"align-self:flex-start;border-left:2px solid #E5A64A;background:rgba(229,166,74,0.05);border-radius:0 10px 10px 0;padding:11px 16px;display:flex;gap:5px;\">\n<span style=\"width:6px;height:6px;border-radius:50%;background:#E5A64A;animation:dotBlink 1.4s infinite;\"><\u002Fspan>\n<span style=\"width:6px;height:6px;border-radius:50%;background:#E5A64A;animation:dotBlink 1.4s 0.2s infinite;\"><\u002Fspan>\n<span style=\"width:6px;height:6px;border-radius:50%;background:#E5A64A;animation:dotBlink 1.4s 0.4s infinite;\"><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:0 24px 16px;\">\n<div style=\"display:flex;gap:7px;margin-bottom:10px;\">\n<span style=\"font-size:11px;color:rgba(180,200,225,0.7);padding:4px 11px;border-radius:12px;border:1px solid rgba(130,160,200,0.18);\">Explain it simpler<\u002Fspan>\n<span style=\"font-size:11px;color:rgba(180,200,225,0.7);padding:4px 11px;border-radius:12px;border:1px solid rgba(130,160,200,0.18);\">Give an example<\u002Fspan>\n<span style=\"font-size:11px;color:rgba(180,200,225,0.7);padding:4px 11px;border-radius:12px;border:1px solid rgba(130,160,200,0.18);\">Quiz me<\u002Fspan>\n<span style=\"font-size:11px;color:rgba(180,200,225,0.7);padding:4px 11px;border-radius:12px;border:1px solid rgba(130,160,200,0.18);\">What am I missing?<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;\">\n<div style=\"flex:1;height:42px;display:flex;align-items:center;padding:0 16px;border-radius:21px;background:rgba(15,21,30,0.8);border:1px solid rgba(130,160,200,0.16);font-size:13px;color:rgba(150,168,195,0.5);\">Ask your mentor...<\u002Fdiv>\n<div style=\"width:38px;height:38px;border-radius:50%;background:rgba(84,169,255,0.18);border:1px solid rgba(84,169,255,0.4);display:flex;align-items:center;justify-content:center;\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 13 13\"><path d=\"M1.5 6.5 H10 M7 3 L10.5 6.5 L7 10\" stroke=\"#9CC8FF\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:11px;color:rgba(150,168,195,0.4);margin-top:9px;\">End conversation<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 1d MENTOR FULLSCREEN ============ -->\n<div id=\"1d\">\n<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;\"><span style=\"font-size:11px;font-weight:600;color:#54A9FF;border:1px solid rgba(84,169,255,0.3);border-radius:4px;padding:2px 6px;\">1d<\u002Fspan><span style=\"font-size:12px;color:rgba(160,180,210,0.7);\">Mentor fullscreen — chat + subtree, sources, progress<\u002Fspan><\u002Fdiv>\n<div style=\"position:relative;width:1440px;height:900px;overflow:hidden;background:#0b1017;border:1px solid #1c2530;border-radius:12px;display:flex;flex-direction:column;\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid rgba(130,160,200,0.1);\">\n<div style=\"display:flex;align-items:center;gap:16px;\">\n<span style=\"font-size:20px;font-weight:600;color:#E8EFF7;\">linearized attention<\u002Fspan>\n<span style=\"font-size:10px;font-weight:600;letter-spacing:1.4px;color:#54A9FF;background:rgba(84,169,255,0.08);border:1px solid rgba(84,169,255,0.3);border-radius:4px;padding:3px 8px;\">LEARNING<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:18px;\">\n<div style=\"display:flex;align-items:center;gap:6px;\">\n<span style=\"font-size:10.5px;color:rgba(150,168,195,0.5);margin-right:2px;\">Level<\u002Fspan>\n<span style=\"width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;border:1px solid rgba(130,160,200,0.15);color:rgba(160,180,210,0.5);\">1<\u002Fspan>\n<span style=\"width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;border:1px solid rgba(130,160,200,0.15);color:rgba(160,180,210,0.5);\">2<\u002Fspan>\n<span style=\"width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;border:1px solid rgba(84,169,255,0.5);background:rgba(84,169,255,0.15);color:#BFDCFF;\">3<\u002Fspan>\n<span style=\"width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;border:1px solid rgba(130,160,200,0.15);color:rgba(160,180,210,0.5);\">4<\u002Fspan>\n<span style=\"width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;border:1px solid rgba(130,160,200,0.15);color:rgba(160,180,210,0.5);\">5<\u002Fspan>\n<\u002Fdiv>\n<svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\"><path d=\"M5.5 1.5 H1.5 V5.5 M1.5 1.5 L6 6 M8.5 12.5 H12.5 V8.5 M12.5 12.5 L8 8\" stroke=\"rgba(160,180,210,0.7)\" stroke-width=\"1.3\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-size:18px;line-height:1;color:rgba(160,180,210,0.7);\">×<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;display:flex;min-height:0;\">\n<div style=\"width:65%;display:flex;flex-direction:column;border-right:1px solid rgba(130,160,200,0.08);\">\n<div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:13px;padding:24px 48px;overflow:hidden;\">\n<div style=\"max-width:78%;align-self:flex-start;border-left:2px solid #E5A64A;background:rgba(229,166,74,0.05);border-radius:0 10px 10px 0;padding:11px 16px;font-family:'Newsreader',serif;font-size:15px;line-height:1.55;color:#D7DFEA;\">You’ve got the core mechanism — the running state φ(K)ᵀV replaces the full attention matrix. Quick check: if the sequence length doubles, what happens to the memory cost of that state?<\u002Fdiv>\n<div style=\"max-width:64%;align-self:flex-end;background:rgba(84,169,255,0.1);border:1px solid rgba(84,169,255,0.18);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.5;color:#CFE2F8;\">Nothing — it’s d×d, so it doesn’t depend on sequence length at all.<\u002Fdiv>\n<div style=\"max-width:78%;align-self:flex-start;border-left:2px solid #E5A64A;background:rgba(229,166,74,0.05);border-radius:0 10px 10px 0;padding:11px 16px;font-family:'Newsreader',serif;font-size:15px;line-height:1.55;color:#D7DFEA;\">Right — that’s the whole appeal for long contexts. The trade-off is expressiveness: the kernel map is a lossy summary of the keys, which is why quality can drop on tasks that need precise retrieval. That’s the next aspect: knowing when <em>not<\u002Fem> to use it.<\u002Fdiv>\n<div style=\"align-self:flex-start;border-left:2px solid #E5A64A;background:rgba(229,166,74,0.05);border-radius:0 10px 10px 0;padding:12px 17px;display:flex;gap:5px;\">\n<span style=\"width:6px;height:6px;border-radius:50%;background:#E5A64A;animation:dotBlink 1.4s infinite;\"><\u002Fspan>\n<span style=\"width:6px;height:6px;border-radius:50%;background:#E5A64A;animation:dotBlink 1.4s 0.2s infinite;\"><\u002Fspan>\n<span style=\"width:6px;height:6px;border-radius:50%;background:#E5A64A;animation:dotBlink 1.4s 0.4s infinite;\"><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:0 48px 22px;\">\n<div style=\"display:flex;gap:7px;margin-bottom:10px;\">\n<span style=\"font-size:11px;color:rgba(180,200,225,0.7);padding:4px 11px;border-radius:12px;border:1px solid rgba(130,160,200,0.18);\">Explain it simpler<\u002Fspan>\n<span style=\"font-size:11px;color:rgba(180,200,225,0.7);padding:4px 11px;border-radius:12px;border:1px solid rgba(130,160,200,0.18);\">Give an example<\u002Fspan>\n<span style=\"font-size:11px;color:rgba(180,200,225,0.7);padding:4px 11px;border-radius:12px;border:1px solid rgba(130,160,200,0.18);\">Quiz me<\u002Fspan>\n<span style=\"font-size:11px;color:rgba(180,200,225,0.7);padding:4px 11px;border-radius:12px;border:1px solid rgba(130,160,200,0.18);\">What am I missing?<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;\">\n<div style=\"flex:1;height:44px;display:flex;align-items:center;padding:0 18px;border-radius:22px;background:rgba(15,21,30,0.8);border:1px solid rgba(130,160,200,0.16);font-size:13.5px;color:rgba(150,168,195,0.5);\">Ask your mentor...<\u002Fdiv>\n<div style=\"width:40px;height:40px;border-radius:50%;background:rgba(84,169,255,0.18);border:1px solid rgba(84,169,255,0.4);display:flex;align-items:center;justify-content:center;\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 13 13\"><path d=\"M1.5 6.5 H10 M7 3 L10.5 6.5 L7 10\" stroke=\"#9CC8FF\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:11px;color:rgba(150,168,195,0.4);margin-top:9px;\">End conversation<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:35%;background:rgba(255,255,255,0.015);padding:26px 30px;display:flex;flex-direction:column;gap:26px;overflow:hidden;\">\n<div>\n<div style=\"font-size:10px;letter-spacing:1.4px;color:rgba(150,168,195,0.5);margin-bottom:12px;\">IN YOUR TREE<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:7px;font-size:12.5px;\">\n<div style=\"display:flex;align-items:center;gap:8px;color:#9FE0C4;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#5FCE9E;\"><\u002Fspan>sequence models<\u002Fdiv>\n<div style=\"margin-left:11px;border-left:1px solid rgba(130,160,200,0.18);padding-left:14px;display:flex;flex-direction:column;gap:7px;\">\n<div style=\"display:flex;align-items:center;gap:8px;color:#9FE0C4;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#5FCE9E;\"><\u002Fspan>attention<\u002Fdiv>\n<div style=\"margin-left:11px;border-left:1px solid rgba(130,160,200,0.18);padding-left:14px;display:flex;flex-direction:column;gap:7px;\">\n<div style=\"display:flex;align-items:center;gap:8px;color:#9FE0C4;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#5FCE9E;\"><\u002Fspan>softmax attention<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;color:#BFDCFF;background:rgba(84,169,255,0.1);border:1px solid rgba(84,169,255,0.35);border-radius:6px;padding:4px 9px;margin-left:-9px;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#54A9FF;box-shadow:0 0 6px rgba(84,169,255,0.7);\"><\u002Fspan>linearized attention<span style=\"font-size:10px;color:rgba(150,185,225,0.5);margin-left:auto;\">you are here<\u002Fspan><\u002Fdiv>\n<div style=\"margin-left:11px;border-left:1px solid rgba(130,160,200,0.18);padding-left:14px;display:flex;flex-direction:column;gap:7px;\">\n<div style=\"display:flex;align-items:center;gap:8px;color:#9CC8FF;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#54A9FF;\"><\u002Fspan>kernel methods<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;color:#9FE0C4;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#5FCE9E;\"><\u002Fspan>matrix associativity<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;color:rgba(160,180,210,0.55);\"><span style=\"width:7px;height:7px;border-radius:50%;border:1px dashed #5B6673;\"><\u002Fspan>flash attention<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;color:rgba(160,180,210,0.55);\"><span style=\"width:7px;height:7px;border-radius:50%;border:1px dashed #5B6673;\"><\u002Fspan>state space models<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:10px;letter-spacing:1.4px;color:rgba(150,168,195,0.5);margin-bottom:12px;\">SOURCES<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px;\">\n<div style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid rgba(130,160,200,0.12);background:rgba(15,21,30,0.5);\">\n<span style=\"width:8px;height:8px;border-radius:50%;background:#7FB4E8;\"><\u002Fspan>\n<span style=\"font-size:12.5px;color:#C4D2E4;\">Moonshots — Kimi K3<\u002Fspan>\n<span style=\"font-size:10.5px;color:rgba(150,168,195,0.45);margin-left:auto;\">podcast<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid rgba(130,160,200,0.12);background:rgba(15,21,30,0.5);\">\n<span style=\"width:8px;height:8px;border-radius:50%;background:#7FB4E8;\"><\u002Fspan>\n<span style=\"font-size:12.5px;color:#C4D2E4;\">Transformers are RNNs<\u002Fspan>\n<span style=\"font-size:10.5px;color:rgba(150,168,195,0.45);margin-left:auto;\">paper<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:10px;letter-spacing:1.4px;color:rgba(150,168,195,0.5);margin-bottom:12px;\">PROGRESS<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:18px;\">\n<div style=\"position:relative;width:64px;height:64px;\">\n<svg width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 64 64\"><circle cx=\"32\" cy=\"32\" r=\"27\" fill=\"none\" stroke=\"rgba(130,160,200,0.15)\" stroke-width=\"4\"><\u002Fcircle><circle cx=\"32\" cy=\"32\" r=\"27\" fill=\"none\" stroke=\"#54A9FF\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"101.8 169.6\" transform=\"rotate(-90 32 32)\"><\u002Fcircle><\u002Fsvg>\n<span style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#BFDCFF;\">3/5<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px;font-size:11.5px;\">\n<span style=\"color:rgba(160,180,210,0.75);margin-bottom:2px;\">3 of 5 aspects covered<\u002Fspan>\n<span style=\"color:#9FE0C4;\">✓ quadratic cost<\u002Fspan>\n<span style=\"color:#9FE0C4;\">✓ kernel feature maps<\u002Fspan>\n<span style=\"color:#9FE0C4;\">✓ associativity<\u002Fspan>\n<span style=\"color:rgba(150,168,195,0.45);\">· training stability<\u002Fspan>\n<span style=\"color:rgba(150,168,195,0.45);\">· when it fails<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 1e EMPTY STATE ============ -->\n<div id=\"1e\">\n<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;\"><span style=\"font-size:11px;font-weight:600;color:#54A9FF;border:1px solid rgba(84,169,255,0.3);border-radius:4px;padding:2px 6px;\">1e<\u002Fspan><span style=\"font-size:12px;color:rgba(160,180,210,0.7);\">Empty state — first run<\u002Fspan><\u002Fdiv>\n<div style=\"position:relative;width:1440px;height:900px;overflow:hidden;background:#0a0f16;border:1px solid #1c2530;border-radius:12px;\">\n<div style=\"position:absolute;inset:0;\">{{ gE }}<\u002Fdiv>\n<div style=\"position:absolute;top:26px;left:28px;display:flex;align-items:center;gap:9px;z-index:20;\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 22 22\"><line x1=\"11\" y1=\"19\" x2=\"11\" y2=\"10\" stroke=\"#54A9FF\" stroke-width=\"1.4\"><\u002Fline><line x1=\"11\" y1=\"10\" x2=\"5\" y2=\"5\" stroke=\"#54A9FF\" stroke-width=\"1.4\"><\u002Fline><line x1=\"11\" y1=\"10\" x2=\"17\" y2=\"6\" stroke=\"#54A9FF\" stroke-width=\"1.4\"><\u002Fline><circle cx=\"11\" cy=\"19\" r=\"2\" fill=\"#54A9FF\"><\u002Fcircle><circle cx=\"5\" cy=\"5\" r=\"1.6\" fill=\"none\" stroke=\"#54A9FF\" stroke-width=\"1.3\"><\u002Fcircle><circle cx=\"17\" cy=\"6\" r=\"1.6\" fill=\"none\" stroke=\"#5FCE9E\" stroke-width=\"1.3\"><\u002Fcircle><\u002Fsvg>\n<span style=\"font-size:15px;font-weight:500;letter-spacing:0.04em;color:#DCE6F2;\">Dendrite<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position:absolute;top:28px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:20;\">\n<div style=\"display:flex;align-items:center;gap:12px;width:600px;height:52px;padding:0 20px;border-radius:26px;background:rgba(15,21,30,0.88);border:1px solid rgba(84,169,255,0.28);backdrop-filter:blur(14px);box-shadow:0 8px 32px rgba(0,0,0,0.45),0 0 24px rgba(84,169,255,0.08);\">\n<svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\"><circle cx=\"6.5\" cy=\"6.5\" r=\"5\" fill=\"none\" stroke=\"rgba(160,180,210,0.6)\" stroke-width=\"1.4\"><\u002Fcircle><line x1=\"10.5\" y1=\"10.5\" x2=\"14\" y2=\"14\" stroke=\"rgba(160,180,210,0.6)\" stroke-width=\"1.4\"><\u002Fline><\u002Fsvg>\n<span style=\"font-size:14px;color:rgba(150,168,195,0.55);\">Type a concept, paste a transcript, or search your knowledge...<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;\">\n<span style=\"font-size:11.5px;color:rgba(160,180,210,0.6);padding:5px 12px;border-radius:14px;border:1px solid rgba(130,160,200,0.14);background:rgba(15,21,30,0.5);\">Analyze source<\u002Fspan>\n<span style=\"font-size:11.5px;color:rgba(160,180,210,0.6);padding:5px 12px;border-radius:14px;border:1px solid rgba(130,160,200,0.14);background:rgba(15,21,30,0.5);\">Learn concept<\u002Fspan>\n<span style=\"font-size:11.5px;color:rgba(160,180,210,0.6);padding:5px 12px;border-radius:14px;border:1px solid rgba(130,160,200,0.14);background:rgba(15,21,30,0.5);\">Search<\u002Fspan>\n<\u002Fdiv>\n<div style=\"width:1px;height:34px;background:linear-gradient(to bottom,rgba(130,160,200,0.4),rgba(130,160,200,0));margin-top:6px;\"><\u002Fdiv>\n<div style=\"max-width:380px;text-align:center;font-size:13.5px;line-height:1.55;color:#A9B8CC;background:rgba(15,21,30,0.6);border:1px solid rgba(130,160,200,0.12);border-radius:10px;padding:14px 20px;\">Start with a concept you want to understand, or paste a transcript.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:28px;bottom:26px;z-index:20;\">\n<div style=\"width:32px;height:32px;border-radius:50%;background:rgba(84,169,255,0.12);border:1px solid rgba(130,160,200,0.3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#BFD6F2;\">P<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 1f LOADING & ERROR ============ -->\n<div id=\"1f\">\n<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;\"><span style=\"font-size:11px;font-weight:600;color:#54A9FF;border:1px solid rgba(84,169,255,0.3);border-radius:4px;padding:2px 6px;\">1f<\u002Fspan><span style=\"font-size:12px;color:rgba(160,180,210,0.7);\">Loading &amp; error states<\u002Fspan><\u002Fdiv>\n<div style=\"position:relative;width:1440px;height:380px;overflow:hidden;background:#0a0f16;border:1px solid #1c2530;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:80px;\">\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:16px;\">\n<span style=\"font-size:10px;letter-spacing:1.4px;color:rgba(150,168,195,0.45);\">COMMAND BAR · PROCESSING<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:12px;width:440px;height:52px;padding:0 20px;border-radius:26px;background:rgba(15,21,30,0.88);border:1px solid rgba(84,169,255,0.25);box-shadow:0 0 24px rgba(84,169,255,0.07);\">\n<svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" style=\"animation:spin 1.6s linear infinite;transform-origin:center;\"><circle cx=\"7.5\" cy=\"7.5\" r=\"6\" fill=\"none\" stroke=\"rgba(84,169,255,0.6)\" stroke-width=\"1.6\" stroke-dasharray=\"26 12\"><\u002Fcircle><\u002Fsvg>\n<span style=\"font-size:14px;background:linear-gradient(90deg,rgba(160,180,210,0.4),rgba(225,238,255,0.95),rgba(160,180,210,0.4));background-size:220px 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.4s linear infinite;\">Analyzing ‘Moonshots — Kimi K3’...<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-size:11px;color:rgba(150,168,195,0.4);\">Reading the transcript — this can take up to 30 seconds<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:16px;\">\n<span style=\"font-size:10px;letter-spacing:1.4px;color:rgba(150,168,195,0.45);\">MENTOR · THINKING<\u002Fspan>\n<div style=\"border-left:2px solid #E5A64A;background:rgba(229,166,74,0.05);border-radius:0 10px 10px 0;padding:13px 18px;display:flex;gap:5px;\">\n<span style=\"width:6px;height:6px;border-radius:50%;background:#E5A64A;animation:dotBlink 1.4s infinite;\"><\u002Fspan>\n<span style=\"width:6px;height:6px;border-radius:50%;background:#E5A64A;animation:dotBlink 1.4s 0.2s infinite;\"><\u002Fspan>\n<span style=\"width:6px;height:6px;border-radius:50%;background:#E5A64A;animation:dotBlink 1.4s 0.4s infinite;\"><\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-size:11px;color:rgba(150,168,195,0.4);\">Thinking it through — usually 10–30 seconds<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:16px;\">\n<span style=\"font-size:10px;letter-spacing:1.4px;color:rgba(150,168,195,0.45);\">ERROR TOAST<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;background:rgba(15,21,30,0.95);border:1px solid rgba(224,122,110,0.35);box-shadow:0 10px 30px rgba(0,0,0,0.5);\">\n<span style=\"width:8px;height:8px;border-radius:50%;background:#E07A6E;\"><\u002Fspan>\n<span style=\"font-size:13px;color:#C4D2E4;\">Source expired — analyze again.<\u002Fspan>\n<span style=\"font-size:12.5px;color:#9CC8FF;margin-left:6px;\">Retry<\u002Fspan>\n<span style=\"font-size:15px;color:rgba(160,180,210,0.5);margin-left:4px;\">×<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;nodeCount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:34,&quot;min&quot;:16,&quot;max&quot;:60,&quot;step&quot;:2,&quot;unit&quot;:&quot;nodes&quot;,&quot;section&quot;:&quot;Graph&quot;},&quot;glowIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;section&quot;:&quot;Graph&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:1,&quot;max&quot;:99,&quot;section&quot;:&quot;Graph&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const seed = this.props.seed ?? 7;\n    const n = this.props.nodeCount ?? 34;\n    const glow = this.props.glowIntensity ?? 1;\n    return {\n      gA: this.graph(seed, n, glow, {}),\n      gB: this.graph(seed, n, glow, { ghosts: true }),\n      gC: this.graph(seed, n, glow, { dim: true }),\n      gE: this.graph(seed, 0, glow, { empty: true })\n    };\n  }\n  rng(seed) {\n    let a = seed >>> 0 || 1;\n    return () => {\n      a |= 0; a = a + 0x6D2B79F5 | 0;\n      let t = Math.imul(a ^ a >>> 15, 1 | a);\n      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;\n      return ((t ^ t >>> 14) >>> 0) / 4294967296;\n    };\n  }\n  graph(seed, count, glow, o) {\n    const R = React.createElement, r = this.rng(seed);\n    const col = { learning: '#54A9FF', learned: '#5FCE9E', suggested: '#5B6673' };\n    const names = ['attention', 'transformers', 'backpropagation', 'gradient descent', 'embeddings', 'tokenization', 'KV cache', 'LoRA', 'RLHF', 'mixture of experts', 'quantization', 'flash attention', 'rotary embeddings', 'distillation', 'chain of thought', 'retrieval (RAG)', 'vector search', 'fine-tuning', 'scaling laws', 'sparse attention', 'beam search', 'sampling', 'perplexity', 'cross-entropy', 'softmax', 'layer norm', 'residual stream', 'positional encoding', 'self-supervision', 'contrastive learning', 'diffusion models', 'world models', 'in-context learning', 'curriculum learning', 'optimizer states', 'dropout', 'attention heads', 'model merging', 'grokking', 'linear probes'];\n    let nodes = [], edges = [];\n    if (o.empty) {\n      nodes = [\n        { x: 660, y: 500, st: 'learning', deg: 2, label: 'attention' },\n        { x: 845, y: 598, st: 'suggested', deg: 1 },\n        { x: 555, y: 632, st: 'suggested', deg: 1 }\n      ];\n      edges = [[0, 1], [0, 2]];\n    } else {\n      for (let i = 0; i < count; i++) {\n        let x = 100, y = 500, t = 0;\n        while (t++ < 90) {\n          x = 90 + r() * 1260; y = 115 + r() * 725;\n          if (y < 160 && x > 370 && x < 1070) continue;\n          if (nodes.every(p => (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y) > 6400)) break;\n        }\n        const q = r();\n        nodes.push({ x, y, st: q < 0.42 ? 'learned' : q < 0.7 ? 'learning' : 'suggested', deg: 0, label: names[i % names.length] });\n      }\n      for (let i = 1; i < nodes.length; i++) {\n        const k = r() < 0.4 ? 2 : 1;\n        nodes.slice(0, i)\n          .map((p, j) => ({ j, d: (p.x - nodes[i].x) ** 2 + (p.y - nodes[i].y) ** 2 }))\n          .sort((a, b) => a.d - b.d).slice(0, k)\n          .forEach(m => { edges.push([i, m.j]); nodes[i].deg++; nodes[m.j].deg++; });\n      }\n    }\n    const gh = o.ghosts ? [\n      { x: 880, y: 430, l: 'KV cache offloading', hot: true },\n      { x: 1046, y: 296, l: 'MoE routing' },\n      { x: 748, y: 618, l: 'speculative decoding' },\n      { x: 1152, y: 524, l: 'long-context RoPE' },\n      { x: 596, y: 302, l: 'context distillation' }\n    ] : [];\n    const kids = [], labeled = [];\n    edges.forEach(([a, b], i) => kids.push(R('line', { key: 'e' + i, x1: nodes[a].x, y1: nodes[a].y, x2: nodes[b].x, y2: nodes[b].y, stroke: 'rgba(110,150,205,0.14)', strokeWidth: 1 })));\n    nodes.forEach((p, i) => {\n      const rad = (o.empty ? 7 : 5) + p.deg * 2.2;\n      const c = { key: 'n' + i, cx: p.x, cy: p.y, r: rad };\n      if (p.st === 'suggested') Object.assign(c, { fill: 'rgba(91,102,115,0.08)', stroke: col.suggested, strokeWidth: 1, strokeDasharray: '3 4', opacity: 0.75 });\n      else if (p.st === 'learning') Object.assign(c, { fill: 'rgba(84,169,255,0.16)', stroke: col.learning, strokeWidth: 1.4, style: { filter: 'drop-shadow(0 0 ' + 7 * glow + 'px rgba(84,169,255,0.5))' } });\n      else Object.assign(c, { fill: 'rgba(95,206,158,0.12)', stroke: col.learned, strokeWidth: 1.2, style: { filter: 'drop-shadow(0 0 ' + 4 * glow + 'px rgba(95,206,158,0.35))' } });\n      kids.push(R('circle', c));\n      const clear = labeled.every(q => (q.x - p.x) ** 2 + (q.y - p.y) ** 2 > 13000) && gh.every(g => (g.x - p.x) ** 2 + (g.y - p.y) ** 2 > 16000);\n      if (p.label && (o.empty || (p.deg >= 3 && clear))) {\n        labeled.push(p);\n        kids.push(R('text', { key: 't' + i, x: p.x, y: p.y + rad + 15, textAnchor: 'middle', fontSize: 11, fill: 'rgba(185,200,222,0.55)', fontFamily: \"'Space Grotesk',sans-serif\" }, p.label));\n      }\n    });\n    if (o.ghosts) {\n      gh.forEach((g, i) => {\n        kids.push(R('circle', { key: 'g' + i, cx: g.x, cy: g.y, r: g.hot ? 13 : 10, fill: 'rgba(127,180,232,0.10)', stroke: 'rgba(127,180,232,0.5)', strokeWidth: 1.2, style: { animation: 'ghostPulse ' + (3 + i * 0.5) + 's ease-in-out infinite', filter: g.hot ? 'drop-shadow(0 0 ' + 9 * glow + 'px rgba(127,180,232,0.55))' : 'none' } }));\n        if (g.hot) kids.push(R('circle', { key: 'gr' + i, cx: g.x, cy: g.y, r: 21, fill: 'none', stroke: 'rgba(127,180,232,0.25)', strokeWidth: 1, strokeDasharray: '2 5' }));\n        kids.push(R('text', { key: 'gl' + i, x: g.x, y: g.y + (g.hot ? 13 : 10) + 16, textAnchor: 'middle', fontSize: 11, fontStyle: 'italic', fill: 'rgba(150,185,225,0.55)', fontFamily: \"'Space Grotesk',sans-serif\" }, g.l));\n      });\n    }\n    return R('svg', { width: 1440, height: 900, viewBox: '0 0 1440 900', style: { position: 'absolute', left: 0, top: 0, opacity: o.dim ? 0.45 : 1 } }, kids);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
