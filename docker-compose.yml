services:
  neo4j:
    image: neo4j:5-community
    container_name: mentor-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme123}
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
      - ./db:/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-changeme123}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mentor-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      AUTHOR_URL: http://author:8700
      TEACH_ARTIFACT_DIR: /artifacts
      TEACH_MODE: "${TEACH_MODE:-on}"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002"
    volumes:
      - ./backend:/app
      - ./db:/import
      - ./.artifacts:/artifacts
    depends_on:
      neo4j:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Lesson workbench. In dev it shares the default network; in production it sits on its own
  # internal network with only the API (see the Ansible role).
  author:
    build:
      context: ./author
      dockerfile: Dockerfile.prod
    container_name: mentor-author
    ports:
      - "127.0.0.1:8700:8700"   # dev only: lets tests on the Mac reach the workbench
    user: "10003:10002"
    read_only: true
    tmpfs:
      - /work:size=256m,uid=10003,gid=10002,mode=0700
      - /tmp:size=256m,uid=10003,gid=10002,mode=0700
    volumes:
      - ./.artifacts/assets:/assets:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.5

  frontend:
    build: ./frontend
    container_name: mentor-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  neo4j_data:
