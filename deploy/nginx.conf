# One address for the app and the API. The PWA needs same-origin (/api on the page's own host), and
# the lesson frame's security policy assumes it. TLS is added in front (Caddy, Tailscale serve, a
# cloud load balancer): see docs/VPS.md. Keep this file as is; change the compose file instead.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;          # voice notes are sent as WAV

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;      # a mentor answer or a lesson job can take minutes
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    location = /sw.js {                # the service worker must never come from a cache
        proxy_pass http://frontend:3000/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
